name: CI/CD Pipeline

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy?schema=public"

      - name: Run ESLint
        run: pnpm run lint

      - name: Type Check TypeScript
        run: pnpm exec tsc --noEmit

      - name: Build Next.js Application
        run: pnpm run build
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy?schema=public"
          NEXTAUTH_SECRET: "dummy-secret-for-ci-build"
          NEXTAUTH_URL: "http://localhost:3000"
          GOOGLE_CLIENT_ID: "dummy-google-id"
          GOOGLE_CLIENT_SECRET: "dummy-google-secret"
          BREVO_API_KEY: "dummy-brevo-api-key"
          BREVO_SENDER_EMAIL: "notifications@example.com"
          UPSTASH_REDIS_REST_URL: "https://dummy-upstash-url.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "dummy-upstash-token"
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: "dummy-vapid-public-key"
          VAPID_PRIVATE_KEY: "dummy-vapid-private-key"
          VAPID_SUBJECT: "mailto:admin@example.com"

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level high
        continue-on-error: true