name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -X GET "https://arooeuwfiljmzqhcuslz.supabase.co/rest/v1/Item?limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"