name: Keep Services Alive

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -X GET "https://arooeuwfiljmzqhcuslz.supabase.co/rest/v1/Item?limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"

  ping-upstash:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Upstash Redis
        run: |
          curl -X GET "${{ secrets.UPSTASH_REDIS_REST_URL }}/get/keepalive" \
          -H "Authorization: Bearer ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}"